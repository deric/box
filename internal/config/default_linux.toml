# box - bubblewrap (bwrap) wrapper configuration.
#
# Paths may use ~, $HOME, $PWD (the directory box is started from) and any
# other environment variable. Paths that do not exist on the host are skipped
# with a warning; prefix a path with "?" to skip it silently.
#
# The [default] section applies to every binary. A [binaries.<name>] section
# overrides it for one binary: list values are appended to the defaults
# (use drop_binds to remove inherited entries), scalar values replace them.

[default]
# Host paths mounted read-only.
ro_binds = [
  "/bin", "/sbin", "/lib", "?/lib32", "/lib64", "/usr",
  "/etc", "?/opt", "?/run/systemd/resolve",
  "?~/.config/mise", "?~/.gitconfig",
]

# Host paths mounted read-write.
rw_binds = ["$PWD"]

# Device paths mounted read-write with device access (e.g. "/dev/dri").
dev_binds = []

# Fresh tmpfs mounts. $HOME is a tmpfs so stray writes vanish on exit while
# the explicitly listed paths underneath it stay visible.
tmpfs = ["$HOME", "/var/tmp"]

# Give each sandbox its own /tmp: a fresh host directory
# /tmp/box/<binary>-<pid> is mounted as /tmp inside, so nothing other host
# processes put in /tmp (X11 sockets, ...) is exposed, while the files stay
# inspectable from the host. `box clean` removes directories of sandboxes
# that have exited.
private_tmp = true

# Overlay mounts: the host directory is visible underneath, writes go to an
# upper layer and never touch the host. With persist = true the upper layer is
# kept per binary under ~/.local/state/box/overlays (see `box clean`); with
# persist = false it is discarded when the sandbox exits.
overlays = [
  { path = "~/.local/share/mise", persist = true },
]

# Host files copied into the sandbox: the program sees the host content at
# the same path, but changes it makes stay inside and vanish on exit.
copy_files = []

# Network. With network = false the sandbox gets its own, empty network
# namespace (loopback only). proxy = true then starts an HTTP proxy on the
# host that the sandbox reaches through a unix socket bound into it, and only
# hosts matching allow_hosts can be reached: a name matches exactly, "*.x"
# matches anything under x, "*" everything. Inside, HTTP_PROXY, HTTPS_PROXY
# and NO_PROXY point at the proxy; programs that ignore them have no network.
# Denied requests are logged to /tmp/box/<binary>-<pid>.log. Set
# network = true to share the host network instead.
network = false
proxy = true
allow_hosts = [
  "github.com", "*.github.com", "*.githubusercontent.com",
  "registry.npmjs.org", "proxy.golang.org", "sum.golang.org",
  "pypi.org", "files.pythonhosted.org", "crates.io", "*.crates.io",
]

# Hostname inside the sandbox (empty keeps the host name).
hostname = "box"

# Start a new session (setsid). Protects against TIOCSTI terminal injection
# but breaks shell job control (fg, bg, ^Z) for interactive programs.
new_session = true

# Forbid creating user namespaces inside the sandbox, so a program cannot
# build its own namespaces to escape or hide. Nested sandboxes (box inside
# box, Claude Code's own bwrap-based bash sandbox) stop working.
disable_userns = true

# Kill the sandbox when box itself dies.
die_with_parent = true

# Start from an empty environment and pass through only the host variables
# listed in pass_env (names or patterns such as "LC_*"), so secrets and
# session details in the host environment stay outside.
clear_env = true
pass_env = [
  "HOME", "USER", "LOGNAME", "SHELL", "PATH",
  "TERM", "COLORTERM", "LANG", "LC_*", "TZ",
  "EDITOR", "VISUAL", "PAGER",
  "XDG_*_HOME",
  "HTTP_PROXY", "HTTPS_PROXY", "NO_PROXY", "http_proxy", "https_proxy", "no_proxy",
]

# Environment variables to set / unset inside the sandbox. unset_env also
# removes entries from pass_env.
env = { BOX_SANDBOX = "1" }
unset_env = []

# Mount the resolved executable read-only when it lives outside the paths above.
bind_binary = true

# Raw arguments appended to the bwrap command line, for anything not covered.
extra_args = []

# Claude Code keeps its settings, credentials, sessions and memory in
# ~/.claude and its global state in ~/.claude.json. Only the sessions and
# memory under ~/.claude/projects and the login credentials (whose tokens are
# refreshed in place) are shared with the host; the rest of ~/.claude is
# visible but writes to it are discarded on exit, and ~/.claude.json is a
# private copy.
[binaries.claude]
overlays = [{ path = "?~/.claude", persist = false }]
rw_binds = ["?~/.claude/projects", "?~/.claude/.credentials.json"]
copy_files = ["?~/.claude.json"]
pass_env = ["ANTHROPIC_*", "CLAUDE_*"]
allow_hosts = ["*.anthropic.com", "claude.ai", "*.claude.ai", "*.claude.com", "*.sentry.io"]

# Example per-binary sections:
#
# [binaries.trusted-tool]
# private_tmp = false
# rw_binds = ["/tmp"]      # share the host's /tmp instead
#
# [binaries.untrusted-tool]
# network = false
# proxy = false             # no network at all
