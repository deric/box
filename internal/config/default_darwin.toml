# box - macOS sandbox (sandbox-exec / Seatbelt) configuration.
#
# Paths may use ~, $HOME, $PWD (the directory box is started from) and any
# other environment variable. Paths that do not exist on the host are skipped
# with a warning; prefix a path with "?" to skip it silently.
#
# The [default] section applies to every binary. A [binaries.<name>] section
# overrides it for one binary: list values are appended to the defaults
# (use drop_binds to remove inherited entries), scalar values replace them.
#
# Profiles in profile.d/ next to this file (created by `box init`) apply on
# top of both when box is started in a directory under one of their paths. A profile is a TOML file
# with a `paths` list followed by the same [default] and [binaries.<name>]
# sections as this file, merged by the same rules; e.g. profile.d/work.toml:
#
#   paths = ["~/work"]
#
#   [default]
#   rw_parent = true                      # the parent directory is read-write
#   allow_hosts = ["gitlab.example.com"]
#
#   [binaries.claude]
#   pass_env = ["WORK_*"]
#
# When several profiles match, the one with the deepest path is applied last
# and so wins. `box config <command>` shows the profiles that apply here.
#
# Seatbelt cannot remap the filesystem the way bubblewrap does on Linux:
# everything not listed below is denied, symlinks such as /tmp -> /private/tmp
# are resolved, "tmpfs" paths are hidden (their contents cannot be read or
# written), and overlays are exposed read-only.

[default]
# Host paths readable inside the sandbox.
ro_binds = [
  "/usr", "/bin", "/sbin", "/System", "/Library", "/etc",
  "?/private/var/select", "?/private/var/db/timezone", "?/private/var/db/dyld",
  "?/private/var/db/xcode_select_link", "?/private/var/run/resolv.conf",
  "?/opt/homebrew", "?/Applications/Xcode.app",
  "?~/.local/share/mise", "?~/.local/state/mise", "?~/.local/bin",
  "?~/.config/mise", "?~/.gitconfig",
]

# Host paths readable and writable.
rw_binds = ["$PWD"]

# Give each sandbox a temporary directory of its own: a fresh host directory
# /tmp/box/<binary>-<pid>, which TMPDIR points at. The shared /tmp and the
# per-user $TMPDIR under /var/folders are hidden, along with the sockets in
# them (ssh-agent, tmux, ...); programs that write to a fixed path under /tmp
# instead of $TMPDIR fail there. `box clean` removes directories of sandboxes
# that have exited.
private_tmp = true

# Also mount the parent of the working directory read-write, for projects
# that reach into their siblings (a checkout among related checkouts).
# Ignored with a warning when that parent is / or the home directory.
# Meant for profiles, where it applies only under the listed paths.
rw_parent = false

# Device paths readable and writable (the usual /dev nodes are always allowed).
dev_binds = []

# Paths hidden from the sandbox even when a parent path is exposed. The
# paths listed above underneath them stay accessible.
tmpfs = ["$HOME"]

# Overlays are not available on macOS; listed paths are exposed read-only.
overlays = []

# Files or directories the sandbox gets a copy of, written back to the host
# when the command exits (see the claude section below). On APFS the copies
# are clones and cost nothing. Seatbelt cannot place a copy at the original's
# path: it lives under /tmp/box/<binary>-<pid>.sync/copy/ at its path
# relative to the home directory (BOX_SYNC_DIR inside names that directory),
# the original is hidden, and the program has to be told, as box tells Claude
# Code through CLAUDE_CONFIG_DIR. copy_files is not supported.
sync_files = []

# Network. With network = false the sandbox has no network of its own: it
# may connect to nothing but box's proxy, an HTTP proxy that proxy = true
# starts on a loopback port of the host, which only lets hosts matching
# allow_hosts through: a name matches exactly, "*.x" matches anything under
# x, "*" everything. Inside, HTTP_PROXY and HTTPS_PROXY point at the proxy;
# programs that ignore them have no network. Denied requests are logged to
# <log_dir>/<binary>-<pid>-<dir>.log, where <dir> is the working directory
# with slashes turned into dashes (`box top` shows them). Set network = true
# to share the host network instead, or proxy = false for no network at all.
#
# Loopback is the host's, not the sandbox's: programs may listen on it (a
# dev server is reachable from a browser on the host) but connect to
# nothing else there. A request to localhost goes through the proxy like
# any other, so listing "localhost" (or "127.0.0.1") in allow_hosts is what
# reaches a server on the host or one started inside.
#
# With dns = true the sandbox can resolve names through the system resolver
# (mDNSResponder). Answers are not filtered by allow_hosts, so a program can
# look up any name even though it can only connect to the listed hosts; set
# dns = false to leave the sandbox without a resolver (proxy-aware programs
# need none: the proxy resolves the names it connects to).
network = false
proxy = true
dns = true
log_dir = "/tmp/box"
allow_hosts = [
  "api.dagger.cloud", "apt.voxpupuli.org",
  "*.centos.org", "crates.io", "*.crates.io", "crt.sh",
  "*.debian.org", "dl.google.com",
  "files.pythonhosted.org", "forge.puppet.com", "forgeapi.puppet.com",
  "hex.pm",
  "github.com", "*.github.com", "*.githubusercontent.com", "gitlab.com",
  "go.dev", "*.golang.org", "pypi.org",
  "icinga.com", "index.rubygems.org",
  "orca.security", "openwall.com",
  "hub.docker.io",
  "kernel.org", "*.kernel.org",
  "mise-versions.jdx.dev", "mise.jdx.dev",
  "nginx.org","nvd.nist.gov",
  "registry.npmjs.org", "rubygems.org", "registry.dagger.io",
  "storage.googleapis.com",
  # container registries
  "registry-1.docker.io", "auth.docker.io", "index.docker.io",
  "pkgs.org", "production.cloudflare.docker.com",
  "quay.io", "*.quay.io", "ghcr.io",
  "registry.fedoraproject.org", "registry.access.redhat.com", "repology.org",
  "www.securityfocus.com", "*.sigstore.dev", "sigstore.dev",
  # Homebrew
  "formulae.brew.sh", "*.brew.sh",
]

# Start from an empty environment instead of inheriting the host environment.
clear_env = false

# Environment variables to set / unset inside the sandbox.
env = { BOX_SANDBOX = "1" }
unset_env = []

# Allow reading the resolved executable when it lives outside the paths above.
bind_binary = true

# Raw arguments passed to sandbox-exec, e.g. ["-D", "KEY=value"].
extra_args = []

# Raw SBPL rules appended to the generated profile, for anything not covered,
# e.g. '(allow mach-lookup (global-name "com.apple.pasteboard.1"))'.
seatbelt_rules = []

# Claude Code keeps its settings, sessions, memory, skills and plugins in
# ~/.claude, its global state (folder trust, MCP servers, OAuth account) in
# ~/.claude.json and its login credentials in the login keychain. Without
# overlays, both are sync_files: claude works on copies, made when it starts
# and written back to the host when it exits, file by file for the directory,
# so a session on the host meanwhile loses nothing it wrote. A file that
# changed on both sides is shown as a diff and asked about instead. claude is
# pointed at the copies through CLAUDE_CONFIG_DIR, which also makes it keep
# .claude.json inside that directory (box places the copy accordingly). The
# copies stay under /tmp/box/claude-<pid>.sync until `box clean`, to look at
# what a session changed: base/ holds the state at start, copy/ what claude
# left. Skills in the cross-agent ~/.agents/skills are readable.
[binaries.claude]
ro_binds = ["?~/.agents/skills"]
rw_binds = ["?~/Library/Keychains"]
sync_files = ["?~/.claude", "?~/.claude.json"]
allow_hosts = [
  "*.anthropic.com", "claude.ai", "*.claude.ai", "*.claude.com",
]

# Example per-binary sections:
#
# [binaries.trusted-tool]
# network = true            # the host's network, unrestricted
#
# [binaries.untrusted-tool]
# proxy = false             # no network at all
#
# [binaries.quiet-tool]
# dns = false               # proxy only, no name resolution
#
# [binaries.web-dev-tool]
# allow_hosts = ["localhost"]   # reach servers on the host's loopback through the proxy
