name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build packages
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.10"
          verb: call
          args: package --version=${{ github.ref_name }} export --path=dist
      - name: Check packages install
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.10"
          verb: call
          args: check --version=${{ github.ref_name }}
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
